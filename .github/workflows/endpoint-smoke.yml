name: Temporary production graph smoke test

on:
    push:
        branches:
            - arena/e0890e9b-github-readme-activity-graph

jobs:
    graph-endpoint:
        runs-on: ubuntu-latest
        steps:
            - name: Verify the production graph response
              shell: bash
              run: |
                  set -euo pipefail
                  url="https://github-readme-activity-graph-sarang.vercel.app/graph?username=sarang-cmd&probe=${GITHUB_SHA}"
                  status=$(curl --silent --show-error \
                      --dump-header "$RUNNER_TEMP/graph-headers.txt" \
                      --output "$RUNNER_TEMP/graph.svg" \
                      --write-out '%{http_code}' \
                      "$url")
                  content_type=$(grep -i '^content-type:' "$RUNNER_TEMP/graph-headers.txt" | tail -n 1 | tr -d '\r')
                  svg_bytes=$(wc -c < "$RUNNER_TEMP/graph.svg")
                  printf 'HTTP status: %s\n%s\nSVG bytes: %s\n' "$status" "$content_type" "$svg_bytes"
                  printf 'HTTP status: `%s`\n\n%s\n\nSVG bytes: `%s`\n' \
                      "$status" "$content_type" "$svg_bytes" >> "$GITHUB_STEP_SUMMARY"
                  test "$status" = '200'
                  printf '%s' "$content_type" | grep -qi 'image/svg+xml'
                  grep -Eq '^[[:space:]]*<svg' "$RUNNER_TEMP/graph.svg"
